# Releases v<version> when the tag is pushed: the Go module is the tag itself, and this publishes
# @tscomfy/go with the same version (docs/decisions.md D4). npm trusted publishing (OIDC): no
# token is stored, and npm attaches provenance; the package's trusted publisher names this file.
# Two jobs, so that only the one that runs npm can mint the publishing token: build checks and
# packs with read-only permissions, publish publishes the tarball.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: bun install --frozen-lockfile

      - name: The tag matches the package's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(jq -r .version ts/package.json)"
          if [ "$actual" != "$version" ]; then
            echo "::error::@tscomfy/go is $actual, the tag says $version"
            exit 1
          fi

      # The whole gate, which builds dist/ too.
      - run: make check

      # bun pm pack rewrites workspace: ranges; the package must hold its bin and built entry.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          (cd ts && bun pm pack --quiet --destination "$RUNNER_TEMP/release")
          tarball="$RUNNER_TEMP/release/tscomfy-go-${GITHUB_REF_NAME#v}.tgz"
          for file in package/bin/tscomfy-go-export.js package/dist/index.js package/dist/index.d.ts package/dist/main.js; do
            tar -tzf "$tarball" | grep -qx "$file" || { echo "::error::the package has no $file"; exit 1; }
          done
      # The packed package as a user installs it: the generator, run on the example's workflows,
      # writes what the repository holds.
      - name: Install and run the package
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/workflows"
          cp -R examples/txt2img/workflows/comfy examples/txt2img/workflows/txt2img.ts examples/txt2img/workflows/index.ts "$smoke/workflows/"
          core="$(jq -r '.devDependencies["@tscomfy/core"]' ts/package.json)"
          tarball="$RUNNER_TEMP/release/tscomfy-go-${GITHUB_REF_NAME#v}.tgz"
          printf '{"name":"smoke","private":true,"type":"module","dependencies":{"@tscomfy/core":"%s","@tscomfy/go":"file:%s"}}\n' "$core" "$tarball" > "$smoke/workflows/package.json"
          (cd "$smoke/workflows" && bun install)
          go run ./cmd/tscomfy-go -workflows "$smoke/workflows" -out "$smoke/out/workflows"
          diff "$smoke/out/workflows/txt2img.json" examples/txt2img/internal/workflows/txt2img.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release

      # A version already on npm is skipped, so a release that failed halfway can be re-run. A
      # prerelease (v0.2.0-rc.1) goes out as next, so latest stays the last release.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          if npm view "@tscomfy/go@$version" version > /dev/null 2>&1; then
            echo "@tscomfy/go@$version is already published"
          else
            npm publish --tag "$tag" "$RUNNER_TEMP/release/tscomfy-go-$version.tgz"
          fi
